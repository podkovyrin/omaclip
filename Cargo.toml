[package]
name = "omaclip"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Event-driven, clipboard-only Omarchy Android bridge"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "process", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
